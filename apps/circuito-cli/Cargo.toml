[package]
name = "circuito-cli"
description = "The headless `circuito` command: simulate circuits, check schematics and export netlists."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
circuito-core = { path = "../../crates/circuito-core" }
circuito-erc = { path = "../../crates/circuito-erc" }
circuito-spice = { path = "../../crates/circuito-spice" }
circuito-sim = { path = "../../crates/circuito-sim" }
serde_json.workspace = true

[lints]
workspace = true

[lib]
name = "circuito_cli"
path = "src/lib.rs"

[[bin]]
name = "circuito"
path = "src/main.rs"
